[project]
name = "buddy-live-access"
version = "0.1.0"
description = "Buddy live accessibility confirmation assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

